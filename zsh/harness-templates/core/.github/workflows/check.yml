name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make setup
      - run: make check
      - run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
